<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="write-csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Copy Editor{% endblock %}</title>
  <link rel="stylesheet" href="{{ asset('css/app.css') }}">
  <script src="{{ asset('js/htmx.min.js') }}" defer></script>
  <script>
    document.addEventListener('htmx:configRequest', function (event) {
      if (!['GET', 'HEAD', 'OPTIONS'].includes(event.detail.verb.toUpperCase())) {
        event.detail.headers['X-Write-CSRF'] = document.querySelector('meta[name="write-csrf-token"]').content;
      }
    });
  </script>
</head>
<body class="min-h-full bg-stone-50 text-stone-900 antialiased">
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
