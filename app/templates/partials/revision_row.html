{% set origins = {'auto': 'auto-saved', 'manual': 'saved by you', 'create': 'created', 'restore': 'restored'} %}
<li id="rev-{{ r.id }}" class="rev-row{% if r.is_major %} is-major{% endif %}">
  <button type="button" class="star" aria-pressed="{{ 'true' if r.is_major else 'false' }}"
          title="{{ 'Unflag major revision' if r.is_major else 'Flag as major revision' }}"
          hx-post="/d/{{ doc.id }}/revisions/{{ r.id }}/major" hx-target="#rev-{{ r.id }}" hx-swap="outerHTML">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.4 5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>
  </button>
  <div class="min-w-0 flex-1">
    <div class="flex items-baseline gap-2 text-sm">
      <a href="/d/{{ doc.id }}/r/{{ r.id }}" class="font-medium hover:underline">Revision {{ r.seq }}</a>
      {% if r.is_major %}<span class="major-badge">Major</span>{% endif %}
      <span class="ml-auto whitespace-nowrap text-xs text-stone-400" title="{{ r.created_at|fmt_dt }}">{{ r.created_at|ago }}</span>
    </div>
    <div class="mt-0.5 text-xs text-stone-500">{{ r.word_count }} words · {{ origins.get(r.origin, r.origin) }}</div>
    <input name="note" value="{{ r.note }}" placeholder="Add a note" autocomplete="off"
           hx-put="/d/{{ doc.id }}/revisions/{{ r.id }}/note" hx-trigger="change" hx-target="#rev-{{ r.id }}" hx-swap="outerHTML"
           class="mt-1 w-full rounded bg-transparent px-1 py-0.5 text-sm text-stone-800 outline-none placeholder:text-stone-300 focus:bg-white focus:ring-1 focus:ring-stone-300">
    <div class="mt-1 flex gap-3 text-xs">
      <a href="/d/{{ doc.id }}/r/{{ r.id }}" class="text-stone-500 hover:text-stone-900">View &amp; diff</a>
      <button type="button" class="text-stone-500 hover:text-stone-900"
              hx-post="/d/{{ doc.id }}/revisions/{{ r.id }}/restore"
              hx-confirm="Restore revision {{ r.seq }}? The current text is saved as a revision first.">Restore</button>
    </div>
  </div>
</li>
