[project]
name = "copy-editor"
version = "0.2.0"
requires-python = ">=3.12"
license = "MIT"
description = "A workshop tool for prose: Notion-style editor, Genius-style commentary, AI editing passes under your own subscriptions."
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]
